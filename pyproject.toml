[project]
name = "ticket-precedent"
version = "0.1.0"
description = "Have we solved this before? Local hybrid search (BM25 + embeddings) over JIRA and Mantis tickets, served to AI agents over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vladislav Barot", email = "vladislav.barot@gmail.com" }]
requires-python = ">=3.11"
keywords = ["rag", "mcp", "jira", "mantis", "semantic-search", "embeddings", "sqlite-vec"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
]

[project.scripts]
tp = "ticket_precedent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_precedent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RET", "C4", "PT", "PTH", "RUF", "S", "N"]
ignore = [
    "S608", # SQL is assembled only from fixed fragments; values are always bound parameters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sqlite_vec"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["ticket_precedent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

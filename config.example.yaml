# Copy to ~/.config/ticket-precedent/config.yaml (outside the repository).
# ${VARIABLES} are resolved from the environment, from a .env file next to the config,
# and from the files listed in env_files (lowest precedence).

# index_path: ~/.local/share/ticket-precedent/index.db

env_files:
  - ~/secrets/trackers.env

# When set, the MCP server syncs sources older than this many hours in a background thread
# on start-up, so no scheduler is needed. It needs the tracker credentials in its environment,
# as does fetching a ticket that is not indexed yet when an agent asks for it.
auto_sync_hours: 12

embedding:
  model: bge-m3                  # any Ollama embedding model
  url: http://localhost:11434

search:
  rrf_k: 10                      # Reciprocal Rank Fusion constant
  lexical_weight: 0.25           # weight of the BM25 ranking relative to the vector ranking

# Sources of different products can carry a `platform`; searches then stay within one.
# A ticket key keeps to its own platform, free text to this default unless told otherwise.
# default_platform: shop

# The `since` of effort_reference when none is passed, e.g. after a process change made
# older tickets a poor guide: one date for every platform, or a date per platform.
# effort_since: 2026-01-01
# effort_since:
#   shop: 2026-01-01

sources:
  - name: acme-jira
    type: jira                   # JIRA Server / Data Center, REST API v2
    # platform: shop
    url: https://jira.example.com
    jql: project in (SHOP, ERP)
    username: ${JIRA_USERNAME}   # or `token: ${JIRA_PAT}` for a personal access token
    password: ${JIRA_PASSWORD}
    chunking:
      skip_comment_authors: [Jenkins, GitLab]

  - name: acme-helpdesk
    type: mantis                 # MantisBT REST API
    url: https://helpdesk.example.com
    token: ${MANTIS_API_TOKEN}
    project_ids: [12, 15]
    include_private_notes: true
    chunking:
      max_comment_chunks: 30
      min_comment_chars: 80      # default 40; helpdesk threads have a lot of "deployed, please check"

  # - name: acme-cloud
  #   type: jira-cloud           # JIRA Cloud (*.atlassian.net), REST API v2 /search/jql
  #   url: https://acme.atlassian.net
  #   jql: project = SHOP
  #   email: ${JIRA_CLOUD_EMAIL} # basic auth with an API token; omit both for a public site
  #   api_token: ${JIRA_CLOUD_API_TOKEN}
  #   page_size: 50              # at most 100
  #   changelog: true            # effort data; false makes syncs faster

  # - name: acme-github
  #   type: github               # GitHub Issues; pull requests are skipped
  #   repo: [acme/widget, acme/widget-docs]   # one "owner/name" or a list
  #   token: ${GITHUB_TOKEN}     # optional: 60 requests/hour without, 5,000 with
  #   url: https://github.example.com/api/v3  # GitHub Enterprise Server only
  #   rate_limit_wait: 3600      # seconds to wait for a rate-limit reset before failing
